name: UI Visual Validation

on:
  push:
    branches:
      - ui/logimax-reference-20260828

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Automated tests
        run: npm test

      - name: Start application
        run: |
          npm start > /tmp/plataforma.log 2>&1 &
          echo $! > /tmp/plataforma.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/plataforma.log
          exit 1

      - name: Install Chromium for visual QA
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Capture desktop, tablet and mobile
        run: |
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size='1600,1000' --full-page http://127.0.0.1:3000/ ui-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size='900,1100' --full-page http://127.0.0.1:3000/ ui-tablet.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size='390,844' --full-page http://127.0.0.1:3000/ ui-mobile.png

      - name: Basic frontend health
        run: |
          test -s ui-desktop.png
          test -s ui-tablet.png
          test -s ui-mobile.png
          curl -fsS http://127.0.0.1:3000/api/dashboard >/dev/null

      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-logimax
          path: |
            ui-desktop.png
            ui-tablet.png
            ui-mobile.png
          retention-days: 1
